<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FA582D"/>
      <stop offset="50%" stop-color="#8A2BE2"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FA582D"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Squircle with Glowing SASE Border -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5"/>
  
  <!-- Subtle Internal Glow Grid / Accent -->
  <circle cx="32" cy="32" r="22" fill="#00E5FF" fill-opacity="0.04"/>
  <circle cx="16" cy="16" r="1.5" fill="#FA582D" fill-opacity="0.6"/>
  <circle cx="48" cy="48" r="1.5" fill="#00E5FF" fill-opacity="0.6"/>

  <!-- 5G Antenna / Radio Waves and SASE Security Shield -->
  <g filter="url(#glow)">
    <!-- Protective SASE Shield Contour -->
    <path d="M32 9 L49 15.5 V29 C49 40.5 32 51 32 51 C32 51 15 40.5 15 29 V15.5 Z" fill="rgba(11, 15, 25, 0.75)" stroke="url(#shieldGrad)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
    
    <!-- 5G Radio Waves on Sides -->
    <path d="M22 25 C20 27.5 20 31.5 22 34" fill="none" stroke="#00E5FF" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M42 25 C44 27.5 44 31.5 42 34" fill="none" stroke="#00E5FF" stroke-width="2.2" stroke-linecap="round"/>
    
    <!-- 5G Monogram -->
    <text x="32" y="29.5" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-weight="900" font-size="14" fill="url(#textGrad)" text-anchor="middle" dominant-baseline="central" letter-spacing="-0.5">5G</text>
    
    <!-- Cellular Zero-Trust Core Node Dot -->
    <circle cx="32" cy="41" r="2.5" fill="#FA582D"/>
    <circle cx="32" cy="41" r="4.5" fill="none" stroke="#FA582D" stroke-width="1" opacity="0.6"/>
  </g>
</svg>
